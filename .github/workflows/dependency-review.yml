# Reusable dependency check for pull requests: fails when a PR adds a
# dependency with a known high or critical vulnerability.
name: Dependency review (reusable)

on:
  workflow_call:
    inputs:
      fail_on_severity:
        type: string
        default: high

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Is the dependency graph on?
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # The review needs the repo's dependency graph. When it is off, say so instead of failing every PR.
          if gh api "repos/$REPO/dependency-graph/sbom" --silent 2>/dev/null; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            msg="Dependency review skipped: the dependency graph is off. Turn it on in Settings > Code security (or for the whole org) and this check starts working."
            echo "::warning::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.graph.outputs.on == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.graph.outputs.on == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.fail_on_severity }}
