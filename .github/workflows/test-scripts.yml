# Runs the unit tests of the scripts the shared workflows use (scripts/*.test.mjs).
name: Test scripts

on:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/test-scripts.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/test-scripts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: node --test scripts/*.test.mjs
