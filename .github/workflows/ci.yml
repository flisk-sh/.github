# Reusable build and test job for every flisk-sh repo.
# It finds the stack from the files in the repo and runs only what exists:
#   Node: install, then the lint, typecheck, test and build scripts in package.json
#   Python: install, then pytest when there are tests
# A repo with neither passes with a note in the summary.
name: CI (reusable)

on:
  workflow_call:
    inputs:
      working_directory:
        description: Folder that holds package.json or pyproject.toml
        type: string
        default: "."
      node_version:
        type: string
        default: "22"
      python_version:
        type: string
        default: "3.12"
      scripts:
        description: package.json scripts to run, in order, when they exist
        type: string
        default: "lint typecheck test build"

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find the stack
        id: stack
        run: |
          node=false; py=false; pm=npm
          if [ -f package.json ]; then
            node=true
            if [ -f bun.lock ] || [ -f bun.lockb ]; then pm=bun
            elif [ -f pnpm-lock.yaml ]; then pm=pnpm
            elif [ -f yarn.lock ]; then pm=yarn
            fi
          fi
          pydirs=$(git ls-files | { grep -E '(^|/)(pyproject\.toml|requirements\.txt|setup\.py)$' || true; } | awk -F/ 'NF<=4' | xargs -r -n1 dirname | sort -u | tr '\n' ' ')
          if [ -n "$pydirs" ]; then py=true; fi
          {
            echo "pydirs=$pydirs"
            echo "node=$node"
            echo "pm=$pm"
            echo "python=$py"
          } >> "$GITHUB_OUTPUT"
          echo "Stack: node=$node ($pm) python=$py" >> "$GITHUB_STEP_SUMMARY"

      - if: steps.stack.outputs.node == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}

      - if: steps.stack.outputs.pm == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install (Node)
        if: steps.stack.outputs.node == 'true'
        env:
          PM: ${{ steps.stack.outputs.pm }}
        run: |
          case "$PM" in
            bun) bun install --frozen-lockfile || bun install ;;
            pnpm) corepack enable && pnpm install --frozen-lockfile ;;
            yarn) corepack enable; yarn install --immutable || yarn install --frozen-lockfile ;;
            *) if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi ;;
          esac

      - name: Run package scripts
        if: steps.stack.outputs.node == 'true'
        env:
          PM: ${{ steps.stack.outputs.pm }}
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          # The root package plus every workspace package (package.json "workspaces").
          dirs=$(node -e '
            const fs=require("fs"),path=require("path");
            const p=require("./package.json");
            const ws=Array.isArray(p.workspaces)?p.workspaces:(p.workspaces&&p.workspaces.packages)||[];
            const out=["."];
            const expand=(base,parts)=>{
              if(!parts.length){ if(fs.existsSync(path.join(base,"package.json"))) out.push(base); return; }
              const [h,...t]=parts;
              if(h==="*"){ for(const d of fs.readdirSync(base,{withFileTypes:true})) if(d.isDirectory()&&d.name!=="node_modules") expand(path.join(base,d.name),t); }
              else if(fs.existsSync(path.join(base,h))) expand(path.join(base,h),t);
            };
            for(const g of ws) expand(".",g.replace(/\/$/,"").split("/"));
            process.stdout.write([...new Set(out)].join("\n"));')
          ran=0
          for s in $SCRIPTS; do
            for d in $dirs; do
              body=$(node -e 'const p=require(process.argv[2]+"/package.json");process.stdout.write((p.scripts||{})[process.argv[1]]||"")' "$s" "$(cd "$d" && pwd)")
              [ -n "$body" ] || continue
              # npm init puts a test script that always fails; it is not a test.
              if echo "$body" | grep -q 'no test specified'; then echo "skip $d $s: placeholder"; continue; fi
              echo "::group::$d: $PM run $s"
              (cd "$d" && "$PM" run "$s")
              echo "::endgroup::"
              echo "- ran \`$s\` in \`$d\`" >> "$GITHUB_STEP_SUMMARY"
              ran=$((ran+1))
            done
          done
          if [ "$ran" -eq 0 ]; then
            echo "::warning::No lint, typecheck, test or build script found, so this job checked nothing."
            echo "- **no lint, typecheck, test or build script found: this job checked nothing**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.stack.outputs.python == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install and test (Python)
        if: steps.stack.outputs.python == 'true'
        env:
          PYDIRS: ${{ steps.stack.outputs.pydirs }}
        run: |
          python -m pip install --upgrade pip
          for d in $PYDIRS; do
            echo "::group::Python in $d"
            python -m venv "$RUNNER_TEMP/venv-${d//\//_}"
            # shellcheck source=/dev/null
            . "$RUNNER_TEMP/venv-${d//\//_}/bin/activate"
            (
              cd "$d"
              if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
              if [ -f pyproject.toml ] || [ -f setup.py ]; then pip install -e . || pip install .; fi
              if ls -- tests test test_*.py */test_*.py >/dev/null 2>&1; then
                pip install pytest
                pytest -q
                echo "- ran pytest in \`$d\`" >> "$GITHUB_STEP_SUMMARY"
              else
                python -m compileall -q .
                echo "- no Python tests in \`$d\`; compiled the sources only" >> "$GITHUB_STEP_SUMMARY"
              fi
            )
            deactivate
            echo "::endgroup::"
          done

      - name: Nothing to build
        if: steps.stack.outputs.node != 'true' && steps.stack.outputs.python != 'true'
        run: echo "- no package.json or Python project found; nothing to build" >> "$GITHUB_STEP_SUMMARY"
