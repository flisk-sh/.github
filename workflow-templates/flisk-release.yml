name: Release

# Release only a green commit, then check that the deploy answers.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  gate:
    permissions:
      contents: read
      checks: read
    uses: flisk-sh/.github/.github/workflows/release-gate.yml@v1
    with:
      require: "Build and test, GEL guards"

  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: echo "Put your publish or deploy steps here."

  health:
    needs: release
    uses: flisk-sh/.github/.github/workflows/deploy-health.yml@v1
    with:
      url: https://example.com/health
