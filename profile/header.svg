<svg xmlns="http://www.w3.org/2000/svg" width="854" height="240" viewBox="0 0 854 240" role="img" aria-labelledby="t d">
  <title id="t">Flisk CLI</title>
  <desc id="d">Start services on your machine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0E"/>
      <stop offset="0.5" stop-color="#34244F"/>
      <stop offset="1" stop-color="#EE924E"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F7EFE2"/>
      <stop offset="1" stop-color="#FBD3AE"/>
    </linearGradient>
    <clipPath id="clip"><rect width="854" height="240" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="854" height="240" fill="url(#bg)"/>
    <g fill="#F7EFE2">
      <circle cx="90" cy="48" r="1.6"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="30" r="1.2"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="40" r="1.6"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="770" cy="70" r="1.2"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="22" r="1"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="5s" repeatCount="indefinite"/></circle>
    </g>
    <path fill="#F7EFE2" fill-opacity="0.10" d="M0,185 Q213.5,145 427,185 T854,185 T1281,185 T1708,185 V240 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-854 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path fill="#F7EFE2" fill-opacity="0.16" d="M0,205 Q213.5,235 427,205 T854,205 T1281,205 T1708,205 V240 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-854 0" to="0 0" dur="6s" repeatCount="indefinite"/>
    </path>
    <text x="427" y="108" text-anchor="middle" fill="url(#title)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="72" font-weight="700">Flisk CLI
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    </text>
    <text x="427" y="148" text-anchor="middle" fill="#F7EFE2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="500">Start services on your machine.
      <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="1.2s" fill="freeze"/>
    </text>
  </g>
</svg>
